# The only place these two class names exist is in this file, as text.
#
# Nothing on the compile classpath refers to them. jdeps cannot see them, a linker cannot
# see them, and an ahead-of-time compiler that decides what to include by looking at the
# code will not include them. That is the whole of the closed-world problem, in six lines.
plain=com.tiffinbox.aot.PlainFormatter
ledger=com.tiffinbox.aot.LedgerFormatter
