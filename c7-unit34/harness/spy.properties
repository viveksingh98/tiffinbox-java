# Unit 34's p6spy settings (p6spy 3.9.1 reads spy.properties from the folder the JVM starts in - .harness/run): the real drivers it
# wraps, a file appender, the file (spy.log, in .harness/run - never committed: .gitignore), one line per statement.
driverlist=org.h2.Driver,org.postgresql.Driver
appender=com.p6spy.engine.spy.appender.FileLogger
logfile=spy.log
logMessageFormat=com.p6spy.engine.spy.appender.SingleLineFormat
