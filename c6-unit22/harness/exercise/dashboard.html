<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
  <p>Customers: <strong th:text="${customerCount}">0</strong> · This month: <strong th:text="${view.monthRevenue}">0</strong> · Paused days: <strong th:text="${view.pausedDays}">0</strong></p>
  <table>
    <tr><th>Name</th><th>Meals a day</th><th>Price a meal</th><th>Meal type</th><th>Monthly bill</th></tr>
    <tr th:each="c : ${view.custmers}"><td th:text="${c.name}">x</td><td th:text="${c.mealsPerDay}">1</td><td th:text="${c.pricePerMeal}">1</td><td th:text="${c.mealType}">VEG</td><td th:text="${c.monthlyBill()}">0</td></tr>
  </table>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
