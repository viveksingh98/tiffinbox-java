# System.Logger writes through java.util.logging. This file is the switch:
# change one line here and the running service changes what it prints — no recompile.
handlers = java.util.logging.ConsoleHandler
.level   = INFO
java.util.logging.ConsoleHandler.level = INFO
# %5$s is the message alone. The JDK default also stamps a date and the calling
# method, which is exactly the kind of line you can never pin on a slide.
java.util.logging.SimpleFormatter.format = %5$s%n
