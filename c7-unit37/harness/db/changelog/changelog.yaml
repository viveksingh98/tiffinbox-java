databaseChangeLog:
  - changeSet:
      id: 1
      author: tiffinbox
      changes:
        - createTable:
            tableName: customer
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: name, type: VARCHAR(60), constraints: {nullable: false, unique: true}}
              - column: {name: meals_per_day, type: INT, constraints: {nullable: false}}
              - column: {name: price_per_meal, type: INT, constraints: {nullable: false}}
              - column: {name: meal_type, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
        - createTable:
            tableName: pause
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: customer_id, type: BIGINT, constraints: {nullable: false, references: customer(id), foreignKeyName: pause_customer_id_fkey}}
              - column: {name: days, type: INT, constraints: {nullable: false}}
        - createIndex:
            tableName: pause
            indexName: pause_customer_id_idx
            columns:
              - column: {name: customer_id}
  - changeSet:
      id: 2
      author: tiffinbox
      changes:
        - insert: {tableName: customer, columns: [{column: {name: name, value: Ravi}}, {column: {name: meals_per_day, valueNumeric: 2}}, {column: {name: price_per_meal, valueNumeric: 120}}, {column: {name: meal_type, value: VEG}}]}
        - insert: {tableName: customer, columns: [{column: {name: name, value: Meera}}, {column: {name: meals_per_day, valueNumeric: 1}}, {column: {name: price_per_meal, valueNumeric: 150}}, {column: {name: meal_type, value: NON_VEG}}]}
        - insert: {tableName: customer, columns: [{column: {name: name, value: Sunil}}, {column: {name: meals_per_day, valueNumeric: 3}}, {column: {name: price_per_meal, valueNumeric: 100}}, {column: {name: meal_type, value: VEG}}]}
        - insert: {tableName: customer, columns: [{column: {name: name, value: Priya}}, {column: {name: meals_per_day, valueNumeric: 1}}, {column: {name: price_per_meal, valueNumeric: 120}}, {column: {name: meal_type, value: VEGAN}}]}
        - sql: {sql: "INSERT INTO pause (customer_id, days) SELECT id, 3 FROM customer WHERE name = 'Sunil'"}
        - sql: {sql: "INSERT INTO pause (customer_id, days) SELECT id, 2 FROM customer WHERE name = 'Priya'"}
      rollback:
        - delete: {tableName: pause}
        - delete: {tableName: customer}
